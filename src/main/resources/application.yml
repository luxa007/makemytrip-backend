spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/makemytrip
    username: mmt
    password: mmt
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: changeme-must-be-at-least-32-chars-long!!
    expiry-ms: 86400000
  upload:
    dir: /tmp/makemytrip/uploads

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
